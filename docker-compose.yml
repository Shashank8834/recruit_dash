# Names and host ports are parameterised so this stack can run alongside the
# existing v1 deployment during migration. Defaults deliberately avoid the
# v1 container names (recruitment-backend / recruitment-frontend) and the
# host ports it already occupies.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ${STACK_PREFIX:-recruitment-v2}-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-recruitment}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-recruitment}
      - POSTGRES_DB=${POSTGRES_DB:-recruitment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      internal:
        aliases: [recruitment-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruitment}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ${STACK_PREFIX:-recruitment-v2}-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATABASE_URL=postgres://${POSTGRES_USER:-recruitment}:${POSTGRES_PASSWORD:-recruitment}@recruitment-db:5432/${POSTGRES_DB:-recruitment}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_MAX_RPM=${LLM_MAX_RPM:-4}
      - LLM_MAX_TPM=${LLM_MAX_TPM}
      - MATCH_PROMPT_CHARS=${MATCH_PROMPT_CHARS:-12000}
      - MATCH_JD_TEXT_CHARS=${MATCH_JD_TEXT_CHARS:-450}
      - MATCH_CANDIDATE_CHARS=${MATCH_CANDIDATE_CHARS:-5000}
      - MATCH_JD_LIMIT=${MATCH_JD_LIMIT:-5}
      - MATCH_OUTPUT_TOKENS=${MATCH_OUTPUT_TOKENS:-1024}
      - ROUTER_TEXT_CHARS=${ROUTER_TEXT_CHARS:-3000}
      - ROUTER_CONTEXT_CHARS=${ROUTER_CONTEXT_CHARS:-2000}
      - ROUTER_CONTEXT_MESSAGE_CHARS=${ROUTER_CONTEXT_MESSAGE_CHARS:-400}
      - ROUTER_OUTPUT_TOKENS=${ROUTER_OUTPUT_TOKENS:-512}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-2048}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - EVOLUTION_WEBHOOK_TOKEN=${EVOLUTION_WEBHOOK_TOKEN}
      - INGEST_ALLOWED_CHATS=${INGEST_ALLOWED_CHATS}
      - WEBHOOK_FORWARD_URL=${WEBHOOK_FORWARD_URL}
      - WEBHOOK_DEBUG=${WEBHOOK_DEBUG:-0}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - EVOLUTION_DB_URL=${EVOLUTION_DB_URL}
      - BATCH_QUIET_SECONDS=${BATCH_QUIET_SECONDS:-60}
      - BATCH_MAX_WINDOW_SECONDS=${BATCH_MAX_WINDOW_SECONDS:-600}
      - CONFIDENCE_FLOOR=${CONFIDENCE_FLOOR:-0.6}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SERVICE_ACCOUNT_KEY=${GOOGLE_SERVICE_ACCOUNT_KEY}
    volumes:
      - ${SERVICE_ACCOUNT_KEY_FILE:-/dev/null}:/app/service-account.json:ro
    ports:
      - "${BACKEND_HOST_PORT:-3012}:3001"
    networks:
      internal:
        aliases: [recruitment-api]
      shared:
        aliases: [recruitment-api]
    depends_on:
      postgres:
        condition: service_healthy

  # Same image as the backend, different entrypoint. This is the process that
  # closes debounce windows and runs classification.
  worker:
    build:
      context: ./backend
    container_name: ${STACK_PREFIX:-recruitment-v2}-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-recruitment}:${POSTGRES_PASSWORD:-recruitment}@recruitment-db:5432/${POSTGRES_DB:-recruitment}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_MAX_RPM=${LLM_MAX_RPM:-4}
      - LLM_MAX_TPM=${LLM_MAX_TPM}
      - MATCH_PROMPT_CHARS=${MATCH_PROMPT_CHARS:-12000}
      - MATCH_JD_TEXT_CHARS=${MATCH_JD_TEXT_CHARS:-450}
      - MATCH_CANDIDATE_CHARS=${MATCH_CANDIDATE_CHARS:-5000}
      - MATCH_JD_LIMIT=${MATCH_JD_LIMIT:-5}
      - MATCH_OUTPUT_TOKENS=${MATCH_OUTPUT_TOKENS:-1024}
      - ROUTER_TEXT_CHARS=${ROUTER_TEXT_CHARS:-3000}
      - ROUTER_CONTEXT_CHARS=${ROUTER_CONTEXT_CHARS:-2000}
      - ROUTER_CONTEXT_MESSAGE_CHARS=${ROUTER_CONTEXT_MESSAGE_CHARS:-400}
      - ROUTER_OUTPUT_TOKENS=${ROUTER_OUTPUT_TOKENS:-512}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-2048}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - BATCH_QUIET_SECONDS=${BATCH_QUIET_SECONDS:-60}
      - BATCH_MAX_WINDOW_SECONDS=${BATCH_MAX_WINDOW_SECONDS:-600}
      - CONFIDENCE_FLOOR=${CONFIDENCE_FLOOR:-0.6}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - EVOLUTION_DB_URL=${EVOLUTION_DB_URL}
      - MEDIA_MAX_MB=${MEDIA_MAX_MB:-15}
      - MEDIA_MAX_CHARS=${MEDIA_MAX_CHARS:-20000}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SERVICE_ACCOUNT_KEY=${GOOGLE_SERVICE_ACCOUNT_KEY}
    volumes:
      - ${SERVICE_ACCOUNT_KEY_FILE:-/dev/null}:/app/service-account.json:ro
    networks: [internal, shared]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ${STACK_PREFIX:-recruitment-v2}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3013}:80"
    networks: [internal]
    depends_on:
      - backend

volumes:
  pgdata:

# Two networks, deliberately.
#
# `internal` is private to this stack and is the ONLY place the database is
# reachable. A shared network like Evolution's carries many compose projects,
# several of which publish a service named `postgres`; Docker DNS round-robins
# between same-named aliases, so a database on the shared network resolves to a
# different project's server at random and fails authentication intermittently.
#
# `shared` is Evolution's network, joined only by the services that genuinely
# need it: the backend (so Evolution can POST webhooks to it) and the worker
# (so it can fetch resume attachments back from Evolution).
#
# Service aliases are prefixed for the same reason — `backend` and `postgres`
# are far too generic to be unique on a shared network.
networks:
  internal:
    name: ${STACK_PREFIX:-recruitment-v2}-internal
  shared:
    name: ${EVOLUTION_NETWORK:-recruitment-v2-net}
    external: ${EVOLUTION_NETWORK_EXTERNAL:-false}
