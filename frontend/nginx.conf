server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy to the backend's network alias. Not the bare service name: on a
    # shared Docker network `backend` is not unique and DNS may resolve it to
    # another project's container.
    location /api/ {
        proxy_pass http://recruitment-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # CV uploads come through here. Without this, nginx's 1MB default
        # rejects any resume over a megabyte before it reaches the app — and
        # it answers with an HTML error page, so the browser's response.json()
        # fails and the user is shown a parse error rather than "too large".
        # Kept above the app's own CV_UPLOAD_MAX_MB so the app is what reports
        # the limit, in a message that says what to do about it.
        client_max_body_size 20m;

        # Some endpoints wait on a model call, and on a metered tier a single
        # call can sit out a half-minute backoff before it even starts. The
        # 60s default turned a slow-but-working suggestion into a 504, which
        # reads as a crash. Uploading a batch of CVs is slower still: each file
        # costs its own call.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Evolution API posts inbound WhatsApp messages here. Exposed through nginx
    # so the webhook can use port 80 rather than reaching 3001 directly.
    location /webhook/ {
        proxy_pass http://recruitment-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 5m;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
